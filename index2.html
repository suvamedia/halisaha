<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101714">
  <meta name="description" content="Halı saha maçları için esnek kadrolu, dinamik dizilişli takım ve saha planlayıcı.">
  <title>Halı Saha | Takım Planlayıcı</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #101714;
  --panel: #19221e;
  --panel-light: #202c26;
  --border: #2b3931;
  --green: #c8fa68;
  --text: #f2f5f1;
  --muted: #94a399;
  --red: #ff7777;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at 50% 0%, #24372a 0%, transparent 48%), var(--bg);
  color: var(--text);
  font-family: Inter, sans-serif;
  font-size: 14px;
}

button, input, textarea, select { font: inherit; }
button { cursor: pointer; }

.topbar {
  max-width: 1100px;
  margin: auto;
  padding: 24px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #ffffff0e;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text);
  text-decoration: none;
  font-weight: 800;
  letter-spacing: 1px;
}
.brand-icon { font-size: 25px; }
.brand-light { color: var(--green); }
.live-label {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1.5px;
  font-weight: 700;
}
.live-label > span {
  width: 7px;
  height: 7px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 10px #c8fa6880;
}

.container { max-width: 950px; margin: auto; padding: 0 24px; }
.hero { padding: 45px 0 25px; }
.eyebrow, .step {
  color: var(--green);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
}
.hero h1 {
  font-family: "Barlow Condensed", sans-serif;
  font-size: clamp(40px, 7vw, 64px);
  line-height: .98;
  letter-spacing: -1px;
  margin: 12px 0;
  text-transform: uppercase;
}
.hero h1 span { color: var(--green); }
.hero p { color: var(--muted); line-height: 1.7; }

.panel {
  background: #19221eeF;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 16px 45px #00000015;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}
.section-heading h2 {
  font-family: "Barlow Condensed", sans-serif;
  font-size: 28px;
  margin: 4px 0 0;
  text-transform: uppercase;
}
.count-badge, .team-count {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--green);
  background: #101714;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; }

textarea {
  width: 100%;
  resize: vertical;
  min-height: 130px;
  padding: 14px;
  background: #111915;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  line-height: 1.7;
}
textarea:focus { border-color: #8eb64e; outline: none; }

.hint { font-size: 11px; color: var(--muted); line-height: 1.6; margin: 8px 0 0; }

.settings {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 20px;
  padding: 15px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.team-size-buttons {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
  gap: 10px;
  width: 100%;
}

.size-btn {
  height: 42px;
  background: var(--panel-light);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-weight: 800;
  font-size: 13px;
  transition: all 0.2s ease;
}

.size-btn:hover {
  border-color: var(--green);
  color: var(--green);
}

.size-btn.active {
  background: var(--green);
  color: #182116;
  border-color: var(--green);
  box-shadow: 0 0 12px rgba(200, 250, 104, 0.4);
}

.formation-settings { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 16px 0; }
.field-control select { width: 100%; min-height: 42px; padding: 8px 12px; background: #111915; color: var(--text); border: 1px solid var(--border); border-radius: 9px; }

.action-row, .footer-actions { display: flex; gap: 10px; margin-top: 18px; }
.btn {
  min-height: 42px;
  padding: 0 16px;
  border-radius: 9px;
  border: 1px solid transparent;
  font-weight: 800;
  font-size: 12px;
  transition: transform .15s, background .15s;
}
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--green); color: #182116; }
.btn-secondary { background: var(--panel-light); border-color: var(--border); color: var(--text); }
.action-row .btn-primary { flex: 1; }
.message { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
.message.error { color: var(--red); }
.message.success { color: var(--green); }

.results { margin-top: 36px; }

/* Saha Tasarımı */
.pitch-panel { margin: 18px 0; padding: 20px; background: #19221e; border: 1px solid var(--border); border-radius: 14px; }
.pitch-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.pitch-top h3 { margin: 0; font-family: "Barlow Condensed", sans-serif; font-size: 24px; text-transform: uppercase; }

.pitch-container {
  display: flex;
  gap: 15px;
  align-items: stretch;
}

.bench-sidebar {
  width: 160px;
  background: #111915;
  border: 1px dashed var(--border);
  border-radius: 8px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bench-sidebar h4 { margin: 0 0 6px 0; font-size: 11px; text-transform: uppercase; color: var(--green); letter-spacing: 1px; }
.bench-list { flex: 1; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; max-height: 450px; }

.pitch {
  position: relative;
  flex: 1;
  aspect-ratio: 1.05 / 1;
  min-height: 440px;
  border: 2px solid #d6e8d2;
  border-radius: 8px;
  background: repeating-linear-gradient(0deg, #267543 0, #267543 10%, #2d804b 10%, #2d804b 20%);
  isolation: isolate;
}
.pitch:before { content: ""; position: absolute; inset: 3%; border: 2px solid #d7ead3; pointer-events: none; }
.pitch-midline { position: absolute; left: 3%; right: 3%; top: 50%; border-top: 2px solid #d7ead3; }
.pitch-circle { position: absolute; left: 50%; top: 50%; width: 18%; aspect-ratio: 1; border: 2px solid #d7ead3; border-radius: 50%; transform: translate(-50%, -50%); }
.pitch-box { position: absolute; left: 30%; width: 40%; height: 14%; border: 2px solid #d7ead3; }
.pitch-box.top { top: 3%; border-top: 0; }
.pitch-box.bottom { bottom: 3%; border-bottom: 0; }
.pitch-goal { position: absolute; left: 40%; width: 20%; height: 3%; border: 2px solid #d7ead3; background: #d7ead322; }
.pitch-goal.top { top: 3%; }
.pitch-goal.bottom { bottom: 3%; }

/* Saha Slotları & Oyuncular */
.pitch-slot {
  position: absolute;
  transform: translate(-50%, -50%);
  width: clamp(52px, 8vw, 68px);
  min-height: 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  z-index: 2;
  border-radius: 8px;
  padding: 4px;
  transition: background 0.2s, border-color 0.2s;
  border: 1px dashed rgba(255,255,255,0.25);
}
.pitch-slot.drag-over {
  background: rgba(200, 250, 104, 0.35);
  border-color: var(--green);
}

.player-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: grab;
  width: 100%;
  user-select: none;
}
.player-card:active { cursor: grabbing; }

.pitch-shirt {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-size: 10px;
  font-weight: 800;
  box-shadow: 0 2px 5px rgba(0,0,0,0.5);
  border: 2px solid #ffffff;
}
.black .pitch-shirt { background: #101312; color: #fff; }
.white .pitch-shirt { background: #f7f8f4; color: #171c18; }
.bench-item .pitch-shirt { background: #d4a327; color: #fff; }

.pitch-name {
  max-width: 100%;
  padding: 1px 4px;
  border-radius: 3px;
  background: rgba(16, 23, 20, 0.9);
  color: #fff;
  font-size: 9px;
  font-weight: 600;
